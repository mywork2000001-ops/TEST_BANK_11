    function setPart(partKey) {
      currentPart = partKey;
      document.getElementById('btn-part1').className = partKey === 'part1'
        ? "px-6 py-2.5 rounded-xl font-extrabold text-sm transition-all bg-sky-500 text-slate-950 shadow-md"
        : "px-6 py-2.5 rounded-xl font-extrabold text-sm transition-all text-slate-300 hover:text-white";

      document.getElementById('btn-part2').className = partKey === 'part2'
        ? "px-6 py-2.5 rounded-xl font-extrabold text-sm transition-all bg-sky-500 text-slate-950 shadow-md"
        : "px-6 py-2.5 rounded-xl font-extrabold text-sm transition-all text-slate-300 hover:text-white";

      renderPortal();
    }

    function navigateToSubtopic(partKey, chapterId, itemIdx) {
      const part = partsData[partKey];
      const chapter = part.chapters.find(c => c.id === chapterId);
      const azItem = chapter.az.items[itemIdx];
      const fileName = azItem.file || `${azItem.text}.html`;
      const folderName = chapter.folder || chapter.az.title;
      const partFolder = part.folder;

      window.location.href = encodeURI(`./${partFolder}/${folderName}/${fileName}`);
    }

    function renderPortal() {
      const container = document.getElementById("topicsContainer");
      const noResults = document.getElementById("noResults");
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const t = translations[currentLang];
      const activePart = partsData[currentPart];

      container.innerHTML = "";
      let visibleCount = 0;

      activePart.chapters.forEach(chapter => {
        if (currentFilter !== "all" && chapter.category !== currentFilter) {
          return;
        }

        const langData = chapter[currentLang] || chapter.az;
        
        const matchesChapter = langData.title.toLowerCase().includes(query);
        const matchedIndices = [];
        langData.items.forEach((it, idx) => {
          if (it.text.toLowerCase().includes(query)) {
            matchedIndices.push(idx);
          }
        });

        if (query && !matchesChapter && matchedIndices.length === 0) {
          return;
        }

        visibleCount++;

        const indicesToDisplay = query && !matchesChapter 
          ? matchedIndices 
          : langData.items.map((_, idx) => idx);

        let categoryBadge = "";
        if (chapter.category === "algebra") {
          categoryBadge = `<span class="px-2.5 py-1 rounded-md text-[11px] font-bold bg-sky-500/10 text-sky-400 border border-sky-500/20">${t.catAlgebra}</span>`;
        } else if (chapter.category === "geometry") {
          categoryBadge = `<span class="px-2.5 py-1 rounded-md text-[11px] font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">${t.catGeometry}</span>`;
        } else {
          categoryBadge = `<span class="px-2.5 py-1 rounded-md text-[11px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20">${t.catExam}</span>`;
        }

        const itemsHtml = indicesToDisplay.map(idx => {
          const it = langData.items[idx];
          return `
            <div onclick="navigateToSubtopic('${currentPart}', ${chapter.id}, ${idx})" class="subtopic-item group pl-3 py-2 rounded-r-lg items-center justify-between gap-3 text-xs sm:text-sm text-slate-300 hover:text-white">
              <span class="leading-snug">${it.text}</span>
              <span class="arrow-icon text-slate-500 group-hover:text-sky-400 text-sm font-bold transition-all px-2 flex-shrink-0">
                →
              </span>
            </div>
          `;
        }).join("");

        const card = document.createElement("div");
        card.className = "topic-card rounded-2xl p-5 sm:p-6 flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between gap-2 mb-3">
              <div class="flex items-center gap-2">
                <span class="w-6 h-6 rounded-lg bg-slate-800 text-slate-300 flex items-center justify-center text-xs font-black">
                  ${chapter.id}
                </span>
                ${categoryBadge}
              </div>
            </div>

            <h3 class="text-base sm:text-lg font-bold text-white mb-4">
              ${langData.title}
            </h3>

            <div class="flex flex-col gap-1.5 mb-4">
              ${itemsHtml}
            </div>
          </div>

          <div class="pt-4 border-t border-[#24345d]/60 flex items-center justify-between text-xs text-slate-400">
            <span>${langData.items.length} ${t.statTopicsUnit}</span>
            <span class="text-sky-400 font-bold">${t.openTest}</span>
          </div>
        `;
        container.appendChild(card);
      });

      noResults.classList.toggle("hidden", visibleCount > 0);
    }

    function setLang(lang) {
      currentLang = lang;
      const t = translations[lang];

      document.getElementById("btn-az").className = lang === 'az' ? "px-3 py-1.5 rounded-lg text-xs font-bold transition bg-sky-500 text-slate-950" : "px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-300 hover:text-white";
      document.getElementById("btn-ru").className = lang === 'ru' ? "px-3 py-1.5 rounded-lg text-xs font-bold transition bg-sky-500 text-slate-950" : "px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-300 hover:text-white";
      document.getElementById("btn-en").className = lang === 'en' ? "px-3 py-1.5 rounded-lg text-xs font-bold transition bg-sky-500 text-slate-950" : "px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-300 hover:text-white";

      document.getElementById("lbl-main-title").textContent = t.mainTitle;
      document.getElementById("lbl-sub-title").textContent = t.subTitle;
      document.getElementById("lbl-part1-tab").textContent = t.part1Tab;
      document.getElementById("lbl-part2-tab").textContent = t.part2Tab;
      document.getElementById("searchInput").placeholder = t.searchPh;

      document.getElementById("flt-all").textContent = t.fltAll;
      document.getElementById("flt-algebra").textContent = t.fltAlgebra;
      document.getElementById("flt-geometry").textContent = t.fltGeometry;
      document.getElementById("flt-exams").textContent = t.fltExams;

      document.getElementById("lbl-not-found").textContent = t.notFound;
      document.getElementById("lbl-try-again").textContent = t.tryAgain;

      renderPortal();
    }

    function filterCategory(cat) {
      currentFilter = cat;
      const buttons = {
        all: document.getElementById("flt-all"),
        algebra: document.getElementById("flt-algebra"),
        geometry: document.getElementById("flt-geometry"),
        exams: document.getElementById("flt-exams")
      };

      Object.keys(buttons).forEach(k => {
        if (k === cat) {
          buttons[k].className = "px-4 py-2.5 rounded-xl text-xs font-bold bg-sky-500 text-slate-950 whitespace-nowrap";
        } else {
          buttons[k].className = "px-4 py-2.5 rounded-xl text-xs font-bold bg-[#16223f] border border-[#24345d] text-slate-300 hover:text-white whitespace-nowrap";
        }
      });

      renderPortal();
    }

    function handleSearch() {
      renderPortal();
    }

    document.addEventListener("DOMContentLoaded", () => {
      setLang('az');
    });
  </script>
